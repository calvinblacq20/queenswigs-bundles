name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium webkit firefox
      # One device per engine/form factor on every push; run `npm run test:e2e` locally for all 13.
      - run: >-
          npm run test:e2e --
          --project=android-galaxy-s9 --project=android-pixel-7 --project=ios-iphone-se
          --project=ios-ipad-mini --project=desktop-chrome-1366 --project=desktop-safari-1440
          --project=desktop-firefox-1280
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
